# /etc/nginx/sites-available/plexa.ikonetsolutions.com
# Nginx host vhost — proxies to the plexa-demo container on port 8097
server {
    listen 80;
    server_name plexa.ikonetsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name plexa.ikonetsolutions.com;

    ssl_certificate /etc/letsencrypt/live/plexa.ikonetsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plexa.ikonetsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
